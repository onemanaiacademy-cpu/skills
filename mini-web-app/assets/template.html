<style>
  :root {
    --bg: #F3F0E9; --card: #FFFFFF; --ink: #0D1117; --muted: #6B7280; --accent: #FFB020;
    --line: #E4E0D6; --danger: #C2410C; --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D1117; --card: #161B22; --ink: #F3F0E9; --muted: #969CA6; --line: #2A313C; --danger: #FB923C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 20px; margin-bottom: 16px; box-shadow: 0 6px 20px rgb(0 0 0 / .06); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input, select { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1rem; }
  button { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; font-weight: 700;
           font-size: 1rem; cursor: pointer; background: var(--accent); color: #0D1117; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .error { color: var(--danger); min-height: 1.5em; margin: 6px 0 0; }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; letter-spacing: .2em; margin-top: 32px; }
</style>

<script>
  const KEY = "TODO-app-key";
  const money = new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN" });
  const day = iso => new Date(iso + "T00:00:00").toLocaleDateString("pl-PL");   // DD.MM.YYYY

  // Storage can be blocked (private window, settings): the app must still work without it.
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) ?? []; } catch { return []; } }
  function save(data) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { /* not saved */ } }

  function exportCsv(rows, header) {
    const esc = v => `"${String(v).replaceAll('"', '""')}"`;
    const csv = [header, ...rows].map(r => r.map(esc).join(";")).join("\n");   // ";" opens cleanly in Polish Excel
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = KEY + ".csv"; a.click(); URL.revokeObjectURL(a.href);
  }
